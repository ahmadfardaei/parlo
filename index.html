  <script>
  // Light or dark, as the learner chose (shared with the start page); otherwise the device decides.
  (function () { try { var t = localStorage.getItem("iub.theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {} })();
  </script>
  <script>
  // Moving from ahmadfardaei.github.io/parlo: a guest's progress lives in that origin's storage.
  // On the first visit here, bounce once to a page on the old origin that sends it back in the URL.
  (function () {
    try {
      var OLD = "https://ahmadfardaei.github.io", h = location.hash, ls = localStorage;
      var mine = function (k) { return k !== "parlo.moved" && (k.indexOf("parlo.") === 0 || k.indexOf("sb-") === 0); };
      if (h.indexOf("#/moved/") === 0) {
        var p = h.slice(8), have = Object.keys(ls).some(function (k) { return k.indexOf("parlo.items.") === 0 && ls.getItem(k).length > 2; });
        if (p !== "none" && !have && document.referrer.indexOf(OLD) === 0) {
          var bin = atob(p.replace(/-/g, "+").replace(/_/g, "/"));
          var d = JSON.parse(new TextDecoder().decode(Uint8Array.from(bin, function (c) { return c.charCodeAt(0); })));
          Object.keys(d).forEach(function (k) { if (mine(k) && typeof d[k] === "string") ls.setItem(k, d[k]); });
        }
        ls.setItem("parlo.moved", "1");
        history.replaceState(null, "", location.pathname + "#/");
        return;
      }
      if (/(^|\.)iunderstandbut\.com$/.test(location.hostname) && !ls.getItem("parlo.moved")) {
        ls.setItem("parlo.moved", "1");
        if (ls.getItem("parlo.moved") !== "1") return;
        if (Object.keys(ls).some(mine)) return;
        location.replace(OLD + "/parlo-media/move.html");
      }
    } catch (e) {}
  })();
  </script>
